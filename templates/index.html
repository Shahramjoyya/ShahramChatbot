<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Sparrow - PA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            height: 100vh;
            width: 100%;
            background: url('{{ url_for("static", filename="your_image.jpg") }}') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Background image applied in CSS -->
    <div id="container">
        <!-- Chatbot Box -->
        <div id="chat-container">
            <div id="chat-header">
                I’m Jack Sparrow, personal assistant of Shahram Khan
            </div>
            <div id="chatbox">
                <p class="bot-msg">Hello! How may I help you?</p>
            </div>
            <div id="input-container">
                <input type="text" id="question" placeholder="Ask me something...">
                <button onclick="askBot()">Send</button>
                <button onclick="startListening()">🎤</button>
            </div>
        </div>

        <!-- Tips Box -->
        <div id="tips-container">
            <h3>Tips:</h3>
            <p id="tip">Try asking about Shahram's experience or projects.</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
